spring:
  application:
    name: kviz

  datasource:
    url: jdbc:postgresql://localhost:5432/kvizdb
    username: kviz
    password: kviz123

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
  error:
    include-message: always


app:
  jwt:
    secret: ${JWT_SECRET:lokalni-razvojni-kljuc-nije-za-produkciju-32plus}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

logging:
  level:
    org.springframework.security: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  api-docs:
    path: /v3/api-docs